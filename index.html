<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeafletJS</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 style="text-align: center">Pertemuan 11 SIG Jumat</h2>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let map = L.map("map").setView([51.505, -0.09], 13);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
      var marker = L.marker([51.5, -0.09]).addTo(map);
      var circle = L.circle([51.508, -0.11], {
        color: "red",
        fillColor: "#f03",
        fillOpacity: 0.5,
        radius: 500,
      }).addTo(map);
      var polygon = L.polygon([
        [51.509, -0.08],
        [51.503, -0.06],
        [51.51, -0.047],
      ]).addTo(map);
      var loi = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            properties: { Kampus: "stt nf kampus B", Alamat: "lenteng agung" },
            geometry: {
              coordinates: [106.83267935833544, -6.352867778199098],
              type: "Point",
            },
            id: 0,
          },
          {
            type: "Feature",
            properties: {
              nama: "stt nf kampus A",
              alamat: "situ indah kelapa dua",
            },
            geometry: {
              coordinates: [106.84443882412432, -6.362783831470921],
              type: "Point",
            },
            id: 1,
          },
          {
            type: "Feature",
            properties: { nama: "kampus UI", alamat: "depok" },
            geometry: {
              coordinates: [106.82952132736204, -6.3634117439318345],
              type: "Point",
            },
            id: 2,
          },
          {
            type: "Feature",
            properties: {
              nama: "univ.pancasila",
              alamat: "pasar minggu, jakarta",
            },
            geometry: {
              coordinates: [106.83301660693121, -6.339237616815026],
              type: "Point",
            },
            id: 3,
          },
          {
            type: "Feature",
            properties: {
              nama: "univ.gunadarma kelapa dua",
              alamat: "kelapa dua rtm",
            },
            geometry: {
              coordinates: [106.84358102872443, -6.354347753372764],
              type: "Point",
            },
          },
          {
            type: "Feature",
            properties: {
              nama: "kampus polimedia",
              alamat: "srengseng sawah jakarta",
            },
            geometry: {
              coordinates: [106.82727041485754, -6.347006572089597],
              type: "Point",
            },
            id: 5,
          },
        ],
      };
      var geojson = L.geoJSON(loi, {
        onEachFeature: function (feature, layer) {
          layer.bindPopup(feature.properties.nama);
        },
      }).addTo(map);
      L.geoJSON(geojson)
        .bindPopup(function (layer) {
          return layer.feature.properties.nama;
        })
        .addTo(map);
    </script>
  </body>
</html>
